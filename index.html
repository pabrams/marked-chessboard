<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chessboard with Square Control</title>
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0"/>
    <link rel="stylesheet" href="./markers.css"/>
    <link rel="stylesheet" href="./cm-chessboard/chessboard.css"/>
    <link rel="stylesheet" href="./styles.css"/>
    <link rel="stylesheet" href="./cm-chessboard/promotion-dialog.css"/>

    <meta name="description" content="A chessboard that shows square control visually.">
    <meta name="keywords" content="chessboard, chess, square control, visualization, visualize, FEN, Forsyth-Edwards Notation, open source, JavaScript">
    <meta name="author" content="Paul Abrams">
    <meta name="robots" content="index, follow">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B8YJ26GM5Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-B8YJ26GM5Y');
    </script>
    
</head>
<body>

<div class="container">
    <div class="board board-large left-element" id="board"></div>
    <div class="right-element">
        <h1>chessboard with square control</h1>  
        <p>
            <ul>
                <li>
                    Blue frames denote Black control
                </li>
                <li>
                    Green frames denote White control
                </li>
                <li>
                    The higher the control, the more opaque the frame will appear.
                </li>
                <li>
                    Pieces <i>en pris</i> are circled.
                </li>
            </ul>
    
        </p>
        <br/><br/> 
        <h2>
            Square Control
        </h2>
        <input id="chkSquareControl" type="checkbox" name="checkboxName" value="checkboxValue" checked="checked">
        <label for="chkSquareControl" title="Show square control by size of square border.">Show</label>
        <br/><br/>
        <br/><br/>
        <h2>
            <label for="txtInputFen" title="input FEN:">
                Set Position <a href="https://en.wikipedia.org/wiki/Forsyth%E2%80%93Edwards_Notation">(Forsyth-Edwards Notation)</a>
            </label>
        </h2>
        <table>
            <tr>
                <td>
                    <label for="ddFEN" title="Select FEN">Select FEN:</label>
                </td>
                <td>
                    <select id="ddFEN" size="1">
                        <option value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq" selected>Standard starting position</option>
                        <option value="5rk1/pp4pp/4p3/2R3Q1/3n4/2q4r/P1P2PPP/5RK1 b">1912 Levitsky Marshall</option>
                        <option value="r1b2rk1/pp1ppp1p/5bp1/q7/3nP2Q/1BN1B3/PPP2PPP/R4RK1 w">1962 Nezhmetdinov Chernikov</option>
                        <option value="6k1/5r1p/p2N4/nppP2q1/2P5/1P2N3/PQ5P/7K w">1963 Petrosian Spassky</option>
                        <option value="r1b2r1k/4qp1p/p2ppb1Q/4nP2/1p1NP3/2N5/PPP4P/2KR1BR1 w">1965 Kholmov Bronstein</option>
                        <option value="5k2/pp4pp/3bpp2/1P6/8/P2KP3/5PPP/2B5 b">1972 Fischer Spassky game 2</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="txtFEN" title="Select FEN:">Or enter manually:</label>
                </td>
                <td>
                    <input id="txtFEN" type="text" name="FEN" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq" size="40">
                    <button id="btnFEN" type="button">apply</button>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer">
        <hr>
        Source <a href="https://github.com/pabrams/marked-chessboard">github</a>
        <br/>
        Uses <a href="https://github.com/shaack/cm-chessboard">cm-chessboard</a> and <a href="https://github.com/jhlywa/chess.js">chess.js</a>.
    </div>
</div>

<div id="output"></div>
<div style="clear: both"></div>
<script type="module">
    import {INPUT_EVENT_TYPE, COLOR, Chessboard, BORDER_TYPE} from "./cm-chessboard/Chessboard.js"
    import {Accessibility} from "./cm-chessboard/Accessibility.js"
    import {PROMOTION_DIALOG_RESULT_TYPE, PromotionDialog} from "./cm-chessboard/PromotionDialog.js"
    import {FEN} from "./cm-chessboard/Position.js"
    import {MARKER_TYPE, Markers} from "./cm-chessboard/Markers.js"
    import {Chess, SQUARES} from "./chessjs/chess.js"
    const svgNamespace = "http://www.w3.org/2000/svg";

    let chess = new Chess(document.getElementById("txtFEN").value );

    function showSquareControl(chessboard, square) {
        const blackAttackers = chess.attackers(square, 'b').length;
        const whiteAttackers = chess.attackers(square, 'w').length;
        let netAttackers = blackAttackers - whiteAttackers;
        let color = "";
        if (netAttackers > 0) {
            color = 'b';
        } else if (netAttackers < 0) {
            color = 'w';
        }
        netAttackers = Math.abs(netAttackers);
        const blackMarkerType = MARKER_TYPE.framePrimary
        const whiteMarkerType = MARKER_TYPE.frameDanger
        const piece = chessboard.getPiece(square) || ""
        if (color === 'b'){
            for (let i=0; i < netAttackers; i++){
                chessboard.addMarker(blackMarkerType, square);
            }
            if (piece.startsWith('w')){
                chessboard.addMarker(MARKER_TYPE.circlePrimary, square);
            }
        } 

        if (color === 'w') {
            for (let i=0; i < netAttackers; i++){
                chessboard.addMarker(whiteMarkerType, square);
            }
            
            if (piece.startsWith('b')){
                chessboard.addMarker(MARKER_TYPE.circleDanger, square);
            }
        }
    }

    function showAllSquareControl(chessboard){
        chessboard.removeMarkers();
        const checked = document.getElementById("chkSquareControl").checked;
        if (checked){
            const squares = SQUARES;
            squares.forEach((square) => {
                showSquareControl(chessboard, square);
            });
        }
    }

    function applyFEN(chessboard) {
        const fen = document.getElementById("txtFEN").value;
        chess = new Chess(fen);
        chessboard.setPosition(chess.fen(), true).then(() => { // update position, maybe castled and wait for animation has finished
            board.enableMoveInput(inputHandler, chess.turn);
        });
    }

    function getSquareColor(squareString) {
        let ordSquare = squareString;
        ordSquare = ordSquare.replace("a", "1");
        ordSquare = ordSquare.replace("b", "2");
        ordSquare = ordSquare.replace("c", "3");
        ordSquare = ordSquare.replace("d", "4");
        ordSquare = ordSquare.replace("e", "5");
        ordSquare = ordSquare.replace("f", "6");
        ordSquare = ordSquare.replace("g", "7");
        ordSquare = ordSquare.replace("h", "8");

        const file = parseInt(ordSquare.substring(0, 1));
        const rank = parseInt(ordSquare.substring(1, 2));
        
        if ((file + rank) % 2 == 0) {
            return "b";
        } else  {
            return "w";
        }
    }

    function inputHandler(event) {
        if(event.type === INPUT_EVENT_TYPE.movingOverSquare) {
            showAllSquareControl(event.chessboard);
        }
        if(event.type !== INPUT_EVENT_TYPE.moveInputFinished) {
            event.chessboard.removeLegalMovesMarkers();
            showAllSquareControl(event.chessboard);
        }
        if (event.type === INPUT_EVENT_TYPE.moveInputStarted) {
            const moves = chess.moves({square: event.squareFrom, verbose: true})
            event.chessboard.addLegalMovesMarkers(moves);
            return moves.length > 0
        } else if (event.type === INPUT_EVENT_TYPE.validateMoveInput) {
            const move = {from: event.squareFrom, to: event.squareTo, promotion: event.promotion}
            const result = chess.move(move);
            if (result) {
                event.chessboard.state.moveInputProcess.then(() => { // wait for the move input process has finished
                    event.chessboard.setPosition(chess.fen(), true).then(() => { // update position, maybe castled and wait for animation has finished
                        event.chessboard.enableMoveInput(inputHandler, chess.turn);
                    });
                })
            } else {
                // promotion?
                let possibleMoves = chess.moves({square: event.squareFrom, verbose: true})
                for (const possibleMove of possibleMoves) {
                    if (possibleMove.promotion && possibleMove.to === event.squareTo) {
                        event.chessboard.showPromotionDialog(event.squareTo, COLOR.white, (result) => {
                            if (result.type === PROMOTION_DIALOG_RESULT_TYPE.pieceSelected) {
                                chess.move({from: event.squareFrom, to: event.squareTo, promotion: result.piece.charAt(1)});
                            }
                            event.chessboard.setPosition(chess.fen(), true).then(() => {
                                event.chessboard.enableMoveInput(inputHandler, chess.turn);
                            });
                        })
                        return true
                    }
                }
            }
            return result
        } else if (event.type === INPUT_EVENT_TYPE.moveInputFinished) {
            if(event.legalMove) {
                event.chessboard.disableMoveInput()
            }
            showAllSquareControl(event.chessboard);
        }
    }

    const board = new Chessboard(document.getElementById("board"), {
        position: chess.fen(),
        assetsUrl: "./cm-chessboard/assets/",
        responsive: true,
        style: {
            cssClass: "black-and-white",
            borderType: BORDER_TYPE.frame, 
            pieces: {file: "pieces/staunty.svg"}, 
            animationDuration: 300
        },
        orientation: COLOR.white,
        extensions: [
            {class: Markers, props: {autoMarkers: MARKER_TYPE.square}},
            {class: PromotionDialog},
            {
                class: Accessibility,
                props: {
                    brailleNotationInAlt: true, // show the braille notation of the position in the alt attribute of the SVG image
                    boardAsTable: true, // display the board additionally as HTML table
                    movePieceForm: true, // display a form to move a piece (from, to, move)
                    piecesAsList: true, // display the pieces additionally as List
                    visuallyHidden: true // hide all those extra outputs visually but keep them accessible for screen readers and braille displays
                }
            }]
    });

    document
        .querySelector("#chkSquareControl")
        .addEventListener("change", e => {
            showAllSquareControl(board);
        });
    document
        .querySelector("#ddFEN")
        .addEventListener("change", e => {
            document.getElementById("txtFEN").value = document.getElementById("ddFEN").value
            applyFEN(board);
            showAllSquareControl(board);
        });
    document
        .querySelector("#btnFEN")
        .addEventListener("click", () => {
            applyFEN(board);
        });

    showAllSquareControl(board);
    board.enableMoveInput(inputHandler, chess.turn);
</script>
</body>
</html>
